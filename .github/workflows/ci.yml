name: Validate
on:
  push:
    paths-ignore:
      - 'data/public-history.json'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.js
      - run: node --check forecast-core.js
      - run: node --check deepseek.js
      - run: node --check timestral-prep.js
      - run: node --check timestral-worker.js
      - run: node --check scripts/publish-forecasts.cjs
