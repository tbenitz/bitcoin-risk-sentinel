name: Public BTC forecast history
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-forecast-history
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch real Coinbase candles and verify forecasts
        run: node scripts/publish-forecasts.cjs
      - name: Commit verified public results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public BTC forecast history"
            git push
          fi
